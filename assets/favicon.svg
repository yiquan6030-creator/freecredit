<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Glossy Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0505" />
      <stop offset="50%" stop-color="#1c0202" />
      <stop offset="100%" stop-color="#080000" />
    </linearGradient>

    <!-- Super Bright Solid Gold Text Gradient -->
    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fff000" />
      <stop offset="60%" stop-color="#ffb700" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Bright Red Border Gradient -->
    <linearGradient id="redBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1a1a" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#990000" />
    </linearGradient>
  </defs>

  <!-- Outer Round Badge Base -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="url(#redBorder)" stroke-width="24" />
  <circle cx="256" cy="256" r="222" fill="none" stroke="#ffe600" stroke-width="8" opacity="0.9" />

  <!-- Ultra-Bold "4D" Center Text -->
  <g font-family="'Arial Black', Impact, sans-serif" font-weight="900" text-anchor="middle">
    <!-- Solid Black 3D Shadow -->
    <text x="256" y="348" font-size="300" fill="#000000">4D</text>
    <text x="256" y="340" font-size="300" fill="#660000">4D</text>
    <text x="256" y="332" font-size="300" fill="#cc0000" stroke="#ffffff" stroke-width="8">4D</text>
    <!-- Main High-Contrast Gold Face -->
    <text x="256" y="324" font-size="295" fill="url(#goldText)">4D</text>
  </g>
</svg>
